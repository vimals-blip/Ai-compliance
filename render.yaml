services:
  - type: web
    name: ai-compliance-backend
    runtime: python
    rootDir: services/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-compliance-db
          property: connectionString
      - key: LLM_PROVIDER
        value: local

databases:
  - name: ai-compliance-db
    databaseName: compliance
    user: compliance_admin
    plan: free
