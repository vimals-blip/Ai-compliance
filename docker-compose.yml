services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: compliance_user
      POSTGRES_PASSWORD: compliance_password
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_user -d compliance_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compliance-net

  redis:
    image: redis:7-alpine
    container_name: compliance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - compliance-net

  minio:
    image: minio/minio:latest
    container_name: compliance-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compliance-net

  minio-init:
    image: minio/mc:latest
    container_name: compliance-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/compliance-evidence;
      /usr/bin/mc anonymous set download myminio/compliance-evidence;
      exit 0;
      "
    networks:
      - compliance-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: compliance-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://compliance_user:compliance_password@postgres:5432/compliance_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret-jwt-key-replace-in-production-min-32-chars
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: compliance-evidence
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - compliance-net

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: compliance-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://compliance_user:compliance_password@postgres:5432/compliance_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: compliance-evidence
      LLM_PROVIDER: mock
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - compliance-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: compliance-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - api
    networks:
      - compliance-net

networks:
  compliance-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
